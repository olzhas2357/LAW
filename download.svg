<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Логотип бота «Основы права»</title>
  <desc id="desc">Строгая эмблема: судейский молоток из тёмного дерева и раскрытая книга на глубоком синем фоне.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10283C"/><stop offset="1" stop-color="#071724"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#E6B76E"/><stop offset=".42" stop-color="#B9783F"/><stop offset="1" stop-color="#754323"/></linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C58B51"/><stop offset="1" stop-color="#62391F"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2D7A0"/><stop offset=".5" stop-color="#C8A15D"/><stop offset="1" stop-color="#90703C"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFDF5"/><stop offset="1" stop-color="#D9D4C5"/></linearGradient>
    <filter id="shadow" x="-.25" y="-.25" width="1.5" height="1.6"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="91" fill="none" stroke="#B99A62" stroke-opacity=".62" stroke-width="2"/>
  <path d="M65 255a191 191 0 0 1 382 0" fill="none" stroke="#B99A62" stroke-opacity=".24" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <!-- Judge's gavel, angled -->
    <g transform="rotate(-39 256 220)">
      <rect x="245" y="176" width="22" height="147" rx="10" fill="url(#woodDark)" stroke="#E3BD7D" stroke-width="2"/>
      <path d="M250 191v105" stroke="#E9C58A" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>
      <rect x="194" y="137" width="124" height="51" rx="17" fill="url(#wood)" stroke="url(#gold)" stroke-width="3"/>
      <path d="M211 140h89a14 14 0 0 1 14 14v17a14 14 0 0 1-14 14h-89a14 14 0 0 1-14-14v-17a14 14 0 0 1 14-14Z" fill="none" stroke="#F3D9A7" stroke-opacity=".5" stroke-width="2"/>
      <path d="M222 145c18 3 39 3 66 0M219 181c24-4 49-4 73 0" fill="none" stroke="#744522" stroke-opacity=".52" stroke-width="2" stroke-linecap="round"/>
      <path d="M207 145v35M305 145v35" stroke="#F4D9A8" stroke-opacity=".7" stroke-width="3"/>
    </g>
    <!-- carved sound block -->
    <path d="M166 307h180l-13 27H179z" fill="url(#woodDark)" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M180 313h151M185 327h139" stroke="#F0CE94" stroke-opacity=".45" stroke-width="2"/>
    <path d="M177 335h158v12H177z" fill="url(#gold)" stroke="#E7D09F" stroke-width="1.5"/>
  </g>
  <!-- open book, restrained and more finely drawn -->
  <path d="M91 374c54-24 110-19 165 9v63c-53-27-108-32-163-10-10 4-20-3-20-14v-30c0-8 7-15 18-18Z" fill="url(#paper)" stroke="#B99A62" stroke-width="2.5"/>
  <path d="M421 374c-54-24-110-19-165 9v63c53-27 108-32 163-10 10 4 20-3 20-14v-30c0-8-7-15-18-18Z" fill="url(#paper)" stroke="#B99A62" stroke-width="2.5"/>
  <path d="M256 383v63" stroke="#A88C5E" stroke-width="3"/>
  <path d="M95 379c46-18 99-13 151 11M92 389c51-18 104-13 154 12M93 400c50-17 103-12 153 12M94 412c49-17 101-12 152 12M417 379c-46-18-99-13-151 11M420 389c-51-18-104-13-154 12M419 400c-50-17-103-12-153 12M418 412c-49-17-101-12-152 12" fill="none" stroke="#AEB4B2" stroke-opacity=".74" stroke-width="1.6"/>
  <path d="M84 453c61-22 117-17 172 9 55-26 111-31 172-9" fill="none" stroke="#B99A62" stroke-width="2"/>
</svg>
